<div class="vt" role="dialog" aria-modal="true" [attr.aria-label]="titulo()" (click)="closed.emit()">
  <div class="vt__box" (click)="$event.stopPropagation()">
    <div class="vt__head">
      <h2 class="vt__title">{{ titulo() }}</h2>
      <div class="vt__actions">
        @if (puedeCompartir()) {
          <button type="button" class="sgc-btn sgc-btn--ghost sgc-btn--sm" (click)="compartir()" [disabled]="ocupado()" aria-label="Compartir video">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
            Compartir
          </button>
        }
        <button type="button" class="sgc-btn sgc-btn--ghost sgc-btn--sm" (click)="descargar()" [disabled]="ocupado()" aria-label="Descargar video">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
          {{ ocupado() ? 'Preparando…' : 'Descargar' }}
        </button>
        <button type="button" class="vt__close" (click)="closed.emit()" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <div class="vt__body">
      <div class="vt__player">
        <video #video class="vt__video" controls [poster]="poster() || ''" [src]="src()" preload="metadata">
          @if (vtt(); as v) {
            <track kind="subtitles" srclang="es" label="Español" [src]="v" default />
          }
        </video>
      </div>

      @if (capitulos().length) {
        <aside class="vt__caps">
          <h3 class="vt__caps-title">Capítulos</h3>
          <ul>
            @for (c of capitulos(); track c.t) {
              <li><button type="button" (click)="saltarA(c.t)"><span class="vt__caps-t">{{ fmt(c.t) }}</span> {{ c.label }}</button></li>
            }
          </ul>
        </aside>
      }
    </div>

    <div class="vt__foot">
      @if (!feedbackGuardado()) {
        <span class="vt__fb-q">¿Te sirvió este video?</span>
        <button type="button" class="sgc-btn sgc-btn--ghost sgc-btn--sm" (click)="marcar(true)">Sí</button>
        <button type="button" class="sgc-btn sgc-btn--ghost sgc-btn--sm" (click)="marcar(false)">No</button>
      } @else {
        <span class="vt__fb-ok">¡Gracias por tu respuesta!</span>
      }
    </div>
  </div>
</div>
