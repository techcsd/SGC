<div class="filter-select">
  <button type="button" class="filter-select__chip" [class.filter-select__chip--active]="activa()"
    [attr.aria-expanded]="open()" (click)="toggle()">
    <span class="filter-select__label">{{ label() }}</span>
    @if (countLabel()) { <span class="filter-select__val">{{ countLabel() }}</span> }
    <app-icon name="chevron-down" [size]="14" />
  </button>

  @if (open()) {
    <div class="filter-select__pop" role="listbox">
      @if (searchable()) {
        <div class="filter-select__search">
          <app-icon name="search" [size]="14" />
          <input type="text" [value]="query()" (input)="query.set($any($event.target).value)"
            [placeholder]="'Buscar ' + label().toLowerCase() + '…'" (click)="$event.stopPropagation()" />
        </div>
      }
      <div class="filter-select__opts">
        @for (o of filtered(); track o.value) {
          <label class="filter-select__opt">
            <input [type]="multiple() ? 'checkbox' : 'radio'" [checked]="isChecked(o.value)"
              (change)="pick(o.value)" (click)="$event.stopPropagation()" />
            <span>{{ o.label }}</span>
          </label>
        } @empty {
          <p class="filter-select__empty">Sin opciones</p>
        }
      </div>
      @if (activa()) {
        <button type="button" class="filter-select__clear" (click)="limpiar($event)">Quitar filtro</button>
      }
    </div>
  }
</div>
