@if (totalPages() > 1) {
  <nav class="paginator" aria-label="Paginación">
    <span class="paginator__count">{{ desde() }}–{{ hasta() }} {{ 'de' | t }} {{ total() }}</span>

    <div class="paginator__controls">
      <button
        type="button"
        class="paginator__btn"
        (click)="prev()"
        [disabled]="page() === 1"
        aria-label="Página anterior"
      >
        <app-icon name="chevron-left" [size]="16" /> {{ 'Anterior' | t }}
      </button>

      <span class="paginator__page">{{ 'Página' | t }} {{ page() }} {{ 'de' | t }} {{ totalPages() }}</span>

      <button
        type="button"
        class="paginator__btn"
        (click)="next()"
        [disabled]="page() === totalPages()"
        aria-label="Página siguiente"
      >
        {{ 'Siguiente' | t }} <app-icon name="chevron-right" [size]="16" />
      </button>
    </div>
  </nav>
}
