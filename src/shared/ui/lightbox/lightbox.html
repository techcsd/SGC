<div class="lightbox" role="dialog" aria-modal="true" [attr.aria-label]="alt()" (click)="closed.emit()">
  @if (title()) { <span class="lightbox__title" (click)="$event.stopPropagation()">{{ title() }}</span> }
  @if (contador()) { <span class="lightbox__contador" (click)="$event.stopPropagation()">{{ contador() }}</span> }
  <!-- CM5 — descargar la imagen (misma URL firmada que el usuario ya ve). -->
  <a class="lightbox__download" [href]="actual()" target="_blank" rel="noopener" download
     (click)="$event.stopPropagation()" aria-label="Descargar">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </a>
  <button type="button" class="lightbox__close" (click)="closed.emit()" aria-label="Cerrar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>

  @if (galeria()) {
    <button type="button" class="lightbox__nav lightbox__nav--prev" (click)="$event.stopPropagation(); anterior()" aria-label="Foto anterior">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button type="button" class="lightbox__nav lightbox__nav--next" (click)="$event.stopPropagation(); siguiente()" aria-label="Foto siguiente">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  }

  <img
    class="lightbox__img"
    [src]="actual()"
    [alt]="alt()"
    (click)="$event.stopPropagation()"
  />
</div>
