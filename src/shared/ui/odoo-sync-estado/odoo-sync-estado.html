@if (puede() && estado(); as e) {
  <section class="odoo-estado" aria-label="{{ 'Sincronización con Odoo' | t }}">
    <div class="odoo-estado__fila">
      <svg class="odoo-estado__ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16" /><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8" /><path d="M21 3v5h-5" /><path d="M3 21v-5h5" />
      </svg>
      <strong>{{ 'Sincronización con Odoo' | t }}</strong>
      <span class="sgc-badge" [class.sgc-badge--success]="e.estado === 'sincronizado'" [class.sgc-badge--danger]="e.estado === 'error'" [class.sgc-badge--warning]="e.estado !== 'sincronizado' && e.estado !== 'error'">{{ etiqueta[e.estado] | t }}</span>
      @if (puedeReintentar()) {
        <button type="button" class="sgc-btn sgc-btn--secondary sgc-btn--sm" [disabled]="reintentando()" (click)="reintentar()">{{ 'Reintentar' | t }}</button>
      }
    </div>
    @if (e.error) { <p class="odoo-estado__msg">{{ e.error }}</p> }
    <p class="odoo-estado__meta">{{ 'Documento Odoo' | t }}: {{ e.picking_id ?? '—' }} · {{ 'Intentos' | t }}: {{ e.intentos }}</p>
  </section>
}
