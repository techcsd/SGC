<div class="page-header">
  <div>
    <h1 class="page-title">Orden de módulos</h1>
    <p class="page-subtitle">Reordena las secciones del menú lateral. "Administración" queda siempre al final.</p>
  </div>
  <div class="page-header__actions">
    <button type="button" class="sgc-btn sgc-btn--ghost" (click)="restablecer()">Restablecer</button>
    <button type="button" class="sgc-btn sgc-btn--primary" [disabled]="saving()" (click)="guardar()">
      @if (saving()) { <span class="spinner" aria-hidden="true"></span> Guardando… } @else { Guardar orden }
    </button>
  </div>
</div>

@if (error()) { <div class="page-error" role="alert">{{ error() }}</div> }

@if (loading()) {
  <div class="sgc-card"><app-skeleton variant="list" [rows]="6" /></div>
} @else {
  <div class="sgc-card orden-modulos">
    <ol class="orden-modulos__list">
      @for (s of secciones(); track s; let i = $index) {
        <li class="orden-modulos__item">
          <span class="orden-modulos__pos">{{ i + 1 }}</span>
          <span class="orden-modulos__label">{{ s }}</span>
          <span class="orden-modulos__actions">
            <button type="button" class="sgc-btn sgc-btn--ghost sgc-btn--sm" [disabled]="i === 0" (click)="subir(i)" aria-label="Subir">↑</button>
            <button type="button" class="sgc-btn sgc-btn--ghost sgc-btn--sm" [disabled]="i === secciones().length - 1" (click)="bajar(i)" aria-label="Bajar">↓</button>
          </span>
        </li>
      }
    </ol>
  </div>
}
